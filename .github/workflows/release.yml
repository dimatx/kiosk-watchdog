name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the APK is not debug-signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if grep -q 'CN=Android Debug' certs.txt; then
            echo "::error::APK is signed with the debug key - release aborted"
            exit 1
          fi

      - name: Stage APK
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk "kiosk-watchdog-$TAG.apk"
          # The release title is set here rather than left to default to the tag,
          # so it cannot drift depending on who or what published the release.
          echo "RELEASE_NAME=Kiosk Watchdog ${TAG#v}" >> "$GITHUB_ENV"

      # The summary comes from the annotated tag, so writing it is part of
      # tagging rather than a separate step that gets forgotten. A lightweight
      # tag has no message and simply leaves the generated changelog on its own.
      #
      # Write the tag body as markdown with ONE LINE PER PARAGRAPH OR BULLET.
      # It is passed through untouched, and GitHub renders a single newline as a
      # line break - so a body wrapped at 72 columns the way a commit message is
      # arrives full of ragged breaks. Unwrapping it here was tried and rejected:
      # it means parsing prose in shell to guess which newlines are structural,
      # which is more ways to be wrong than just writing the tag correctly.
      - name: Release notes from the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          BODY=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:body)')
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)')
          fi
          {
            echo 'RELEASE_BODY<<GH_EOF'
            printf '%s\n' "$BODY"
            echo 'GH_EOF'
          } >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: kiosk-watchdog-*.apk
          generate_release_notes: true

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
